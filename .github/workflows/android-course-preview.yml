name: Android course preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          cache: true

      - run: flutter pub get

      - run: flutter analyze --no-pub

      - run: flutter test --no-pub test/bilibili_course_link_test.dart test/bilibili_deep_link_service_test.dart

      - run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: FocuBili-course-preview-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
